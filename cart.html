<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your shopping cart — Golden Collection luxury menswear.">
  <title>Cart — Golden Collection</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <section class="cart-page">
    <div class="container">
      <nav class="breadcrumb-list" style="margin-bottom:var(--space-xl);">
        <a href="index.html">Home</a><span class="separator">/</span><span class="current">Cart</span>
      </nav>
      <h1>Shopping <span class="gold-text">Cart</span></h1>
      <div id="cartContent"></div>
    </div>
  </section>
  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById('cartContent');
      if (cart.isEmpty()) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            <h3>Your cart is empty</h3>
            <p>Looks like you haven't added any items yet.</p>
            <a href="shop.html" class="btn btn-primary">Start Shopping</a>
          </div>`;
        return;
      }

      const items = cart.getItems();
      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${items.map(item => `
              <div class="cart-item">
                <div class="cart-item-image">
                  <a href="product.html?id=${item.product.id}"><img src="${item.product.image}" alt="${item.product.name}" loading="lazy"></a>
                </div>
                <div class="cart-item-info">
                  <div class="item-brand">${item.product.brand}</div>
                  <h3><a href="product.html?id=${item.product.id}">${item.product.name}</a></h3>
                  <div class="item-size">Size: ${item.size}</div>
                  <div class="item-price">${formatPrice(item.product.price)}</div>
                </div>
                <div class="cart-item-right">
                  <div class="cart-qty">
                    <button onclick="updateCartItem(${item.productId},'${item.size}',${item.quantity - 1})">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="updateCartItem(${item.productId},'${item.size}',${item.quantity + 1})">+</button>
                  </div>
                  <div style="font-weight:700;">${formatPrice(item.product.price * item.quantity)}</div>
                  <button class="remove-btn" onclick="removeCartItem(${item.productId},'${item.size}')">Remove</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span class="label">Subtotal (${cart.getCount()} items)</span><span class="value">${formatPrice(cart.getSubtotal())}</span></div>
            <div class="summary-row"><span class="label">Original Price</span><span class="value" style="text-decoration:line-through;color:var(--gray-500);">${formatPrice(cart.getOriginalTotal())}</span></div>
            <div class="summary-row savings"><span class="label">You Save</span><span class="value">−${formatPrice(cart.getSavings())}</span></div>
            <div class="summary-row"><span class="label">Shipping</span><span class="value" style="color:var(--green);">${cart.getSubtotal() >= 4999 ? 'FREE' : formatPrice(299)}</span></div>
            <div class="summary-total"><span>Total</span><span class="value">${formatPrice(cart.getSubtotal() + (cart.getSubtotal() >= 4999 ? 0 : 299))}</span></div>
            <a href="checkout.html" class="btn btn-primary btn-lg">Proceed to Checkout</a>
            <a href="shop.html" class="continue-link">← Continue Shopping</a>
          </div>
        </div>`;
    }

    function updateCartItem(id, size, qty) {
      cart.updateQuantity(id, size, qty);
      renderCart();
    }

    function removeCartItem(id, size) {
      cart.remove(id, size);
      showToast('Item removed from cart', 'info');
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = getNavbarHTML();
      document.getElementById('footer-placeholder').innerHTML = getFooterHTML();
      initNavbar(); initSearch(); cart.updateBadge(); wishlist.updateBadge(); auth.updateUI();
      renderCart();
      cart.onChange(() => renderCart());
    });
  </script>
</body>
</html>
