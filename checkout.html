<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Checkout — Complete your order at Golden Collection.">
  <title>Checkout — Golden Collection</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/checkout.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <section class="checkout-page">
    <div class="container">
      <nav class="breadcrumb-list" style="margin-bottom:var(--space-xl);">
        <a href="index.html">Home</a><span class="separator">/</span><a href="cart.html">Cart</a><span class="separator">/</span><span class="current">Checkout</span>
      </nav>
      <h1>Secure <span class="gold-text">Checkout</span></h1>
      <div id="checkoutContent"></div>
    </div>
  </section>
  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = getNavbarHTML();
      document.getElementById('footer-placeholder').innerHTML = getFooterHTML();
      initNavbar(); initSearch(); cart.updateBadge(); wishlist.updateBadge(); auth.updateUI();
      renderCheckout();
    });

    function renderCheckout() {
      const container = document.getElementById('checkoutContent');
      if (cart.isEmpty()) {
        container.innerHTML = `<div class="empty-state"><h3>Nothing to checkout</h3><p>Add items to your cart first.</p><a href="shop.html" class="btn btn-primary">Shop Now</a></div>`;
        return;
      }
      const items = cart.getItems();
      const shipping = cart.getSubtotal() >= 4999 ? 0 : 299;
      const total = cart.getSubtotal() + shipping;

      container.innerHTML = `
        <div class="checkout-layout">
          <div class="checkout-forms">
            <div class="checkout-form-section">
              <h2>Shipping Information</h2>
              <form id="checkoutForm" onsubmit="placeOrder(event)">
                <div class="form-row">
                  <div class="form-group"><label>Full Name *</label><input class="form-input" id="coName" required placeholder="Your full name"></div>
                  <div class="form-group"><label>Email *</label><input class="form-input" type="email" id="coEmail" required placeholder="email@example.com"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Phone *</label><input class="form-input" type="tel" id="coPhone" required placeholder="+91 98765 43210"></div>
                  <div class="form-group"><label>Pincode *</label><input class="form-input" id="coPincode" required placeholder="400001"></div>
                </div>
                <div class="form-group"><label>Address *</label><input class="form-input" id="coAddress" required placeholder="House/Flat No., Street, Landmark"></div>
                <div class="form-row">
                  <div class="form-group"><label>City *</label><input class="form-input" id="coCity" required placeholder="Mumbai"></div>
                  <div class="form-group"><label>State *</label><select class="form-input" id="coState" required>
                    <option value="">Select State</option>
                    <option>Andhra Pradesh</option><option>Bihar</option><option>Delhi</option><option>Goa</option>
                    <option>Gujarat</option><option>Haryana</option><option>Karnataka</option><option>Kerala</option>
                    <option>Madhya Pradesh</option><option>Maharashtra</option><option>Punjab</option><option>Rajasthan</option>
                    <option>Tamil Nadu</option><option>Telangana</option><option>Uttar Pradesh</option><option>West Bengal</option>
                  </select></div>
                </div>
              </form>
            </div>
            <div class="checkout-form-section">
              <h2>Payment Method</h2>
              <div class="payment-methods">
                <label class="payment-option selected" onclick="selectPayment(this,'cod')">
                  <input type="radio" name="payment" value="cod" checked>
                  <div><div class="pay-label">💵 Cash on Delivery</div><div class="pay-desc">Pay when you receive your order</div></div>
                </label>
                <label class="payment-option" onclick="selectPayment(this,'upi')">
                  <input type="radio" name="payment" value="upi">
                  <div><div class="pay-label">📱 UPI Payment</div><div class="pay-desc">Google Pay, PhonePe, Paytm</div></div>
                </label>
                <label class="payment-option" onclick="selectPayment(this,'card')">
                  <input type="radio" name="payment" value="card">
                  <div><div class="pay-label">💳 Credit / Debit Card</div><div class="pay-desc">Visa, Mastercard, RuPay</div></div>
                </label>
              </div>
              <div class="card-fields" id="cardFields">
                <div class="form-group"><label>Card Number</label><input class="form-input" placeholder="1234 5678 9012 3456" maxlength="19"></div>
                <div class="form-row">
                  <div class="form-group"><label>Expiry Date</label><input class="form-input" placeholder="MM/YY" maxlength="5"></div>
                  <div class="form-group"><label>CVV</label><input class="form-input" type="password" placeholder="•••" maxlength="4"></div>
                </div>
                <div class="form-group"><label>Cardholder Name</label><input class="form-input" placeholder="Name on card"></div>
              </div>
            </div>
            <button class="btn btn-primary btn-lg" style="width:100%;" onclick="placeOrder(event)">Place Order — ${formatPrice(total)}</button>
          </div>
          <div class="checkout-summary">
            <h3>Order Summary (${cart.getCount()} items)</h3>
            <div class="checkout-items">
              ${items.map(item => `
                <div class="checkout-item">
                  <img src="${item.product.image}" alt="${item.product.name}">
                  <div class="checkout-item-info">
                    <h4>${item.product.brand} — ${item.product.name}</h4>
                    <p>Size: ${item.size} · Qty: ${item.quantity}</p>
                  </div>
                  <div class="checkout-item-price">${formatPrice(item.product.price * item.quantity)}</div>
                </div>
              `).join('')}
            </div>
            <div class="summary-row"><span class="label">Subtotal</span><span class="value">${formatPrice(cart.getSubtotal())}</span></div>
            <div class="summary-row savings"><span class="label">Discount</span><span class="value">−${formatPrice(cart.getSavings())}</span></div>
            <div class="summary-row"><span class="label">Shipping</span><span class="value" style="color:var(--green);">${shipping === 0 ? 'FREE' : formatPrice(shipping)}</span></div>
            <div class="summary-total"><span>Total</span><span class="value">${formatPrice(total)}</span></div>
          </div>
        </div>`;
    }

    function selectPayment(el, method) {
      document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
      document.getElementById('cardFields').classList.toggle('active', method === 'card');
    }

    function placeOrder(e) {
      e.preventDefault();
      const name = document.getElementById('coName')?.value;
      const email = document.getElementById('coEmail')?.value;
      const phone = document.getElementById('coPhone')?.value;
      const address = document.getElementById('coAddress')?.value;
      const city = document.getElementById('coCity')?.value;
      const state = document.getElementById('coState')?.value;
      const pincode = document.getElementById('coPincode')?.value;

      if (!name || !email || !phone || !address || !city || !state || !pincode) {
        showToast('Please fill in all required fields', 'error');
        return;
      }

      const orderId = 'GC' + Date.now().toString().slice(-8);
      cart.clear();

      document.getElementById('checkoutContent').innerHTML = `
        <div class="order-success">
          <div class="success-icon">✓</div>
          <h2>Order <span class="gold-text">Confirmed!</span></h2>
          <p>Thank you, ${name}! Your luxury pieces are being prepared with care and will be shipped to your address shortly.</p>
          <div class="order-id">Order ID: ${orderId}</div>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>`;
    }
  </script>
</body>
</html>
