<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or create an account — Golden Collection luxury menswear.">
  <title>Account — Golden Collection</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <section class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="gold-gradient-text">Welcome</h1>
          <p>Sign in to access your account & orders</p>
        </div>
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">Login</button>
          <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input class="form-input" type="email" id="loginEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="form-group-password">
              <input class="form-input" type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
          </div>
          <div class="form-error" id="loginError"></div>
          <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input class="form-input" type="text" id="signupName" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input class="form-input" type="email" id="signupEmail" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input class="form-input" type="password" id="signupPassword" required placeholder="Min. 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input class="form-input" type="password" id="signupConfirm" required placeholder="Confirm your password">
          </div>
          <div class="form-error" id="signupError"></div>
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
        </form>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const result = auth.login(email, password);
      const errEl = document.getElementById('loginError');
      if (result.success) {
        errEl.classList.remove('show');
        showToast(result.message, 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else {
        errEl.textContent = result.message;
        errEl.classList.add('show');
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const errEl = document.getElementById('signupError');

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.add('show');
        return;
      }
      const result = auth.signup(name, email, password);
      if (result.success) {
        errEl.classList.remove('show');
        showToast(result.message, 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else {
        errEl.textContent = result.message;
        errEl.classList.add('show');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = getNavbarHTML();
      document.getElementById('footer-placeholder').innerHTML = getFooterHTML();
      initNavbar(); initSearch(); cart.updateBadge(); wishlist.updateBadge(); auth.updateUI();
      // If already logged in, redirect
      if (auth.isLoggedIn()) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
