<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your wishlist — Golden Collection luxury menswear.">
  <title>Wishlist — Golden Collection</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <section class="section" style="margin-top:var(--nav-height); min-height:60vh;">
    <div class="container">
      <nav class="breadcrumb-list" style="margin-bottom:var(--space-xl);">
        <a href="index.html">Home</a><span class="separator">/</span><span class="current">Wishlist</span>
      </nav>
      <h2 class="section-title" style="text-align:left;">My <span class="gold-text">Wishlist</span></h2>
      <p class="section-subtitle" style="text-align:left;" id="wishlistCount"></p>
      <div id="wishlistContent"></div>
    </div>
  </section>
  <div id="footer-placeholder"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderWishlist() {
      const container = document.getElementById('wishlistContent');
      const countEl = document.getElementById('wishlistCount');
      const items = wishlist.getItems();
      countEl.textContent = items.length > 0 ? `${items.length} item${items.length > 1 ? 's' : ''} saved` : '';

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <h3>Your wishlist is empty</h3>
            <p>Save your favorite items to revisit later.</p>
            <a href="shop.html" class="btn btn-primary">Explore Collection</a>
          </div>`;
        return;
      }
      container.innerHTML = `<div class="product-grid">${items.map(p => createProductCard(p)).join('')}</div>`;
      wishlist.updateAllButtons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('navbar-placeholder').innerHTML = getNavbarHTML();
      document.getElementById('footer-placeholder').innerHTML = getFooterHTML();
      initNavbar(); initSearch(); cart.updateBadge(); wishlist.updateBadge(); auth.updateUI();
      renderWishlist();
      wishlist.onChange(() => renderWishlist());
    });
  </script>
</body>
</html>
